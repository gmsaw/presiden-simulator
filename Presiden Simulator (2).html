<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Presiden Simulator</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--n:#0b1a3a;--g:#e8b33a;--k:#f3e9c8;--r:#c8393a;--h:#3a9c4e;--acc:#e8b33a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--n);color:var(--k);font:10px/1.9 "Press Start 2P",monospace;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
.scr{display:none;max-width:980px;margin:0 auto;padding:12px}
.scr.on{display:block}
.box{border:4px solid var(--g);background:#10234d;box-shadow:4px 4px 0 #000}
#st{text-align:center;padding-top:3vh}
.pal canvas{display:block;margin:0 auto;image-rendering:pixelated}
.pal{position:relative;width:fit-content;max-width:560px;margin:0 auto 14px;border:4px solid var(--g);background:linear-gradient(#1a0a14,#5a1a1a 60%,#c8393a);overflow:hidden;box-shadow:4px 4px 0 #000}
.pal .rf{position:absolute;bottom:130px;left:70px;right:70px;height:34px;background:var(--g);clip-path:polygon(0 100%,50% 0,100% 100%)}
.pal .bl{position:absolute;bottom:40px;left:90px;right:90px;height:90px;border:3px solid #000;background:repeating-linear-gradient(90deg,var(--k) 0 14px,#b8a878 14px 22px)}
.pal .gr{position:absolute;bottom:0;left:0;right:0;height:40px;background:#2a1a10}
.fl{position:absolute;bottom:62px;width:28px;height:48px;background:#ff8a1f;clip-path:polygon(50% 0,100% 100%,0 100%);animation:fk .3s steps(2) infinite}
.fl:nth-child(even){background:#ffd23a;animation-duration:.42s}
@keyframes fk{50%{transform:scaleY(.8) translateY(4px)}}
.sm{position:absolute;bottom:150px;width:18px;height:18px;background:#555;opacity:.7;animation:up 2.6s linear infinite}
@keyframes up{to{transform:translateY(-110px) scale(2.2);opacity:0}}
.tsp{position:absolute;bottom:36px;left:14px;transform:scale(.7);transform-origin:bottom left}
.cap{position:absolute;top:8px;left:0;right:0;color:#fff;font-size:10px;text-shadow:2px 2px 0 #000;animation:cp .8s steps(2) infinite}
@keyframes cp{50%{opacity:.3}}
#st h1{color:var(--g);font-size:28px;line-height:1.5;text-shadow:4px 4px 0 var(--r)}
#st p{max-width:520px;margin:20px auto;color:var(--k)}
.btn{background:var(--g);color:var(--n);border:4px solid var(--k);padding:12px 18px;box-shadow:4px 4px 0 #000}
.btn:focus-visible{animation:bl .4s steps(2) infinite;outline:none}
@media(hover:hover){.btn:hover{animation:bl .4s steps(2) infinite}}
@keyframes bl{50%{background:var(--k)}}
#hud{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:8px;margin-bottom:12px}
.s{font-size:8px}.s div.t{display:flex;justify-content:space-between}
.bar{height:12px;border:2px solid var(--k);background:var(--n);margin-top:4px}
.bar i{display:block;height:100%;background:var(--h);transition:width .6s steps(8)}
.bar i.bad{background:var(--r)}
#bb{text-align:right;color:var(--g);font-size:9px;margin-bottom:6px}
#main{display:flex;gap:12px;align-items:stretch}
#sw{width:200px;flex:none;padding:12px;text-align:center}
#sp{height:150px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;animation:bob .8s steps(1) infinite}
@keyframes bob{50%{transform:translateY(4px)}}
.hd{width:48px;height:48px;background:#e0a878;position:relative;border-top:10px solid #2a1a10}
.hd i{position:absolute;top:14px;width:6px;height:6px;background:#000}
.hd i:first-child{left:10px}.hd i:last-child{right:10px}
.hd i{animation:bk 3.2s infinite}@keyframes bk{94%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.hd u{position:absolute;left:17px;top:34px;width:14px;height:3px;background:#000;text-decoration:none}
.happy .hd u{height:7px;border-radius:0 0 9px 9px;background:#7a1a1a}
.sad .hd u{width:10px;left:19px;top:36px;border-radius:6px 6px 0 0}
.angry .hd u{height:5px;border-radius:7px 7px 0 0}
.angry .hd i{height:3px;background:#c8393a}
.shock .hd i{width:8px;height:8px}
.shock .hd u{width:9px;height:11px;left:20px;border-radius:50%;background:#400}
.angry .hd{animation:shk .12s steps(2) infinite}
.happy .hd,.shock .hd{animation:hop .45s steps(2) infinite}
.sad .hd{transform:rotate(-7deg) translateY(4px)}
@keyframes shk{50%{transform:translateX(3px)}}@keyframes hop{50%{transform:translateY(-6px)}}
.bd{width:84px;height:62px;background:var(--c,#1d3b7a);position:relative;border:2px solid #000}
.bd b{position:absolute;left:35px;top:0;width:10px;height:34px;background:var(--r)}
#nm{margin-top:10px;font-size:8px;color:var(--g)}
#dw{flex:1;padding:14px;display:flex;flex-direction:column;min-height:300px;position:relative}
#tx{min-height:130px;cursor:pointer}
#ch{display:flex;flex-direction:column;gap:8px;margin-top:auto}
#ch .btn{text-align:left;font-size:9px;line-height:1.7;background:var(--k)}
#pop{position:absolute;right:10px;top:6px;pointer-events:none}
#pop span{display:block;font-size:9px;animation:fl 1.5s forwards;text-shadow:2px 2px 0 #000}
@keyframes fl{to{transform:translateY(-30px);opacity:0}}
#fd{position:fixed;inset:0;background:#000;display:none;align-items:center;justify-content:center;text-align:center;color:var(--g);z-index:9;padding:20px;line-height:2.2}
#fd.on{display:flex;animation:fi .5s}
@keyframes fi{from{opacity:0}}
#en{text-align:center;padding-top:6vh}
#en .box{padding:18px;border-color:var(--acc)}
#en h2{color:var(--acc);font-size:20px;line-height:1.5}
#en p{max-width:640px;margin:14px auto}
#sum{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;font-size:8px;margin:16px 0}
@media(max-width:600px){
body{font-size:9px}#st h1{font-size:20px}
#hud{grid-template-columns:repeat(3,1fr)}
#main{flex-direction:column}#sw{width:100%;display:flex;align-items:center;gap:14px;text-align:left}
#sp{height:110px;margin-top:-22px;scale:.8;transform-origin:bottom center}#sum{grid-template-columns:repeat(3,1fr)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
/* ===== RESPONSIF: safe-area, dvh, tap target, breakpoint 420 / 600 / landscape / 1100 ===== */
html{-webkit-text-size-adjust:100%}#sp,.hd,.bd{flex:none}body{min-height:100dvh;overflow-x:hidden}
.scr{padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
#tx,#ch .btn,#ed,#ex{overflow-wrap:anywhere}
.pal{max-width:100%}
#gm>div:first-child{flex-wrap:wrap;gap:6px}
@media(pointer:coarse){.btn{min-height:44px}}
@media(max-width:600px){#dw{min-height:240px}#tx{min-height:110px}#en h2{font-size:14px}#st{padding-top:2vh}}
@media(max-width:420px){#hud{grid-template-columns:repeat(2,1fr)}.s:last-child{grid-column:span 2}#st h1{font-size:17px}.btn{padding:10px 12px}}
@media(max-height:480px){#sp{scale:.8;height:110px;margin-top:-22px;transform-origin:bottom center}#dw{min-height:200px}#st{padding-top:1vh}}
@media(min-width:1100px){body{font-size:12px}.scr{max-width:1100px}.s{font-size:9px}#ch .btn{font-size:11px}}
</style></head><body>

<section id="st" class="scr on">
 <div class='pal'><canvas id='pc' width='200' height='120'></canvas><div class='cap'>ISTANA TERBAKAR!</div></div>
 <h1>PRESIDEN<br>SIMULATOR</h1>
 <p>Hari pelantikan belum usai, tapi istana sudah terbakar. Siapa yang menyulutnya? Jawabannya tersembunyi di sebuah buku hitam. Setiap pilihan ada harganya.</p>
 <button class="btn" onclick="startGame()">MULAI</button>
</section>

<section id="gm" class="scr">

 <div id="hud" class="box"></div>
 <div id="main">
  <div id="sw" class="box"><div id="sp"><div class="hd"><i></i><i></i><u></u></div><div class="bd"><b></b></div></div><div id="nm"></div></div>
  <div id="dw" class="box"><div id="pop"></div><div id="tx"></div><div id="ch"></div></div>
 </div>
</section>

<section id="en" class="scr"><div class="box">
 <div style="color:var(--k);font-size:8px">ENDING</div>
 <h2 id="et"></h2><p id="ed"></p><p id="ex" style="font-size:8px;color:var(--g)"></p><div id="sum"></div>
 <button class="btn" onclick="startGame()">MAIN LAGI</button>
</div></section>

<div id="fd"></div>

bangga atau marah.|prajurit viral','d|aj|Di KTT Valdoria, kursi Anda diletakkan dekat toilet. Disengaja atau tidak?|protokol KTT','r|rak|Petani garam protes: garam impor lebih murah dari garam lokal.|petani garam','e|men|Mal raksasa dibangun di atas sawah produktif. Peresmiannya dihadiri artis.|mal raksasa'];
const AP=[['Langkah tegas soal ',{a:5,r:-3},'Aparat bergerak cepat. Tidak semua senang dengan kecepatannya.'],['Ajak semua pihak berdialog soal ',{a:2,r:3,e:-1},'Rapat panjang, kopi banyak, hasilnya lumayan.'],['Danai proyek besar untuk ',{a:5,e:-2,k:3},'Proyek dimulai. Anggarannya ikut membengkak.'],['Tunda dulu, bahas minggu depan',{a:-3,k:-1},'Minggu depan, seperti biasa, datang terlambat.']];
// mk: ganti kunci a dengan stat utama peristiwa (korupsi dibalik tandanya)
const mk=(a,o)=>{const x={};for(const k in o){const key=k=='a'?a:k;x[key]=(x[key]||0)+o[k]*(k=='a'&&a=='k'?-1:1);}return x;};
function mkEvent(s,b){const[a,sp,t,o]=s.split('|');return S(b,sp,t,AP.map(([p,fx,rp],i)=>[i<3?p+o:p,mk(a,fx),'',rp]));}
// buildPlay: sisipkan 12 peristiwa acak ke dalam alur utama di awal tiap permainan
function buildPlay(){const ev=[...EV].sort(()=>Math.random()-.5).slice(0,12),pl=BASE.map(x=>[x]);ev.forEach(s=>{const i=1+Math.floor(Math.random()*(BASE.length-2));pl[i].push(mkEvent(s,BASE[i].babak));});STORY=pl.flat();}

function determineEnding(s){
 const {eko:e,rak:r,mil:m,dip:d,kor:k,flags:f}=s;
 const E=(title,desc,color)=>({title,desc,color});
 if(k>=80&&r<=30)return E("IMPEACHMENT","Parlemen sepakat: Anda dimakzulkan. Korupsi di lingkaran istana terbongkar, sementara rakyat sudah lama berhenti percaya. Anda keluar lewat pintu belakang, dikawal wartawan dan meme.","#c8393a");

 if(k>=60&&m>=60&&r>=50)return E("PRESIDEN ABADI","Semua stabil, tertib, dan tak ada yang berani bertanya kapan Anda turun. Pemilu tetap digelar, hasilnya selalu sama. Ini disebut “kesinambungan”.","#8a6cc8");

 if(r>=70&&k>=70)return E("DIKTATOR RAKYAT","Rakyat memuja Anda, dan Anda memanfaatkannya. Panggung penuh tepuk tangan, kroni makan paling dulu. Populis sejati.","#c8793a");
 if(f.has("pensiun"))return E("PENSIUN DINI","Anda menyerahkan tongkat estafet dan pulang kampung memelihara ayam. Ada yang bilang pengecut, ada yang bilang bijak. Ayam-ayam tak berkomentar.","#3a9c4e");
 if(e>=65&&r>=65&&m>=65&&d>=65&&k<=25)return E("LEGENDA NUSANTARA","Ekonomi tumbuh, rakyat sejahtera, tentara disegani, diplomat dihormati, dan kas negara bersih. Buku sejarah menulis bab baru dengan tinta emas. Anda tidak sempurna, tapi hampir.","#e8b33a");
 if(f.has('buzzer')&&f.has('pakai_buzzer'))return E('RAJA BUZZER','Anda menang telak di media sosial: 400 juta pengikut, 399 juta di antaranya bot. Rakyat sungguhan baru sadar saat tagar Presiden Terbaik ikut trending di desa yang belum kebagian sinyal.','#ff6ad5');
 if(f.has('renovasi')&&f.has('monumen'))return E('KERAN EMAS','Sejarah mengenang Anda lewat dua hal: kamar mandi berkeran emas dan patung setinggi 40 meter. Turis berdatangan, berswafoto di toilet, lalu memberi ulasan bintang lima.','#e8b33a');
 if(f.has('darmo_menteri')&&f.has('makan_umkm'))return E('PRESIDEN WARTEG','Setelah turun takhta, Anda membuka warteg bersama Pak Darmo. Menu andalannya Nasi Presiden. Antreannya lebih panjang dari antrean pelantikan.','#3a9c4e');
 if(f.has('aj_khianat')&&m>=70)return E('KUDETA SENYAP','Pukul 03.00, Ajudan membuka pintu istana dari dalam. Tak ada tembakan, hanya langkah sepatu bot dan kopi yang disajikan terlalu cepat. Anda membaca berita pencopotan Anda dari ponsel yang bukan milik Anda.','#7a8a8a');
 if(f.has('peras')&&r<=45)return E('BUKU HITAM BALIK MENYERANG','Orang yang Anda peras ternyata menyimpan salinan lain yang lebih lengkap. Dalam semalam daftar nama itu berbalik menunjuk Anda. Kini Anda mencari kamar sewa yang tak punya sinyal.','#c8393a');
 if([1,2,3,4,5].every(i=>f.has('hal'+i)))return E('SAKSI KUNCI','Semua halaman Buku Hitam terbuka dan seluruh negeri tahu. Anda dipuji sekaligus diincar. Sejak itu setiap pintu dikunci dua kali dan setiap nasi bungkus diperiksa dulu.','#8aa8d8');
 if(f.has("bakar_buku"))return E("PEMBAKAR BUKU","Buku Hitam jadi abu, dan dengan itu rahasia negara. Nusantara Raya bersih dari dokumen lama, tapi tak seorang pun diadili. Sejarah mencatat Anda sebagai presiden yang menyalakan korek di saat yang tepat, atau yang paling tidak tepat.","#c8793a");
 if(r>=80&&d<=50)return E("SUARA RAKYAT","Anda lemah di meja diplomasi, tapi kuat di jalanan. Rakyat bersama Anda dan dunia luar sulit mengerti kenapa begitu.","#3a9c4e");
 if(e>=75&&k<=30)return E("BAPAK PEMBANGUNAN","Jalan tol, pabrik, pelabuhan. Ekonomi melaju dan tangan Anda relatif bersih. Patung Anda berdiri, dibangun dengan anggaran yang diaudit.","#e8b33a");
 return E("PRESIDEN BIASA","Tidak ada yang menangis saat Anda turun, tidak ada pula yang berpesta. Buku sejarah menyebut Anda dalam satu paragraf. Paragrafnya ramah.","#f3e9c8");
}

// ===== MUSIK: sintesis WebAudio, tanpa file; mood mengikuti stat =====
let AC=null,mute=false,musicT=null,step=0,mood="";
const SC={calm:{n:[0,2,4,7,9,7,4,2],t:380,w:"triangle",r:196},tense:{n:[0,1,3,0,1,3,6,5],t:230,w:"sawtooth",r:130},sad:{n:[0,3,7,3,0,-2,0,3],t:560,w:"sine",r:164},win:{n:[0,4,7,12,7,4,7,9],t:260,w:"square",r:220}};
function tone(f,d,w,v){const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;o.type=w;o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(t+d);}
function moodNow(){const{eko:e,rak:r,kor:k}=state;if(k>=60||r<=30||e<=25)return"tense";if(r<=45||e<=40)return"sad";if(e>=62&&r>=62&&k<=30)return"win";return"calm";}
function musicTick(){if(mute||!AC)return;const s=SC[mood];tone(s.r*Math.pow(2,s.n[step%8]/12),s.t/1000*1.6,s.w,.04);if(step%4==0)tone(s.r/2,s.t/1000*3,"triangle",.06);step++;}
function setMood(){const m=moodNow();if(m===mood&&musicT)return;mood=m;clearInterval(musicT);musicT=setInterval(musicTick,SC[m].t);}
function startMusic(){AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume();setMood();}
function toggleMute(){mute=!mute;$("#mu").textContent=mute?"MUSIK: OFF":"MUSIK: ON";}
// ===== EKSPRESI: wajah sprite berubah menurut pembicara dan hasil pilihan =====
const FACE={opo:"angry",rak:"shock"};
function setFace(f){$("#sp").className=f||"";}
// ===== UI =====
const $=q=>document.querySelector(q);
let timer=null,shownBabak=0,typing=false,fullText="",doneCb=null;
const clamp=v=>Math.max(0,Math.min(100,v));

function buildHUD(){
 $("#hud").innerHTML=Object.keys(NM).map(k=>`<div class="s"><div class="t"><span>${NM[k]}</span><span id="v-${k}"></span></div><div class="bar"><i id="b-${k}" class="${k=="kor"?"bad":""}"></i></div></div>`).join("");
}
// updateHUD: sinkronkan bar dan angka dengan state
function updateHUD(){
 for(const k in NM){$("#b-"+k).style.width=state[k]+"%";$("#v-"+k).textContent=state[k];}
 $("#bb").textContent="BABAK "+state.babak+"/5: "+BT[state.babak-1]+" ("+(state.sceneIndex+1)+"/"+STORY.length+")";setMood();
}
// showStatPopup: angka perubahan melayang
function showStatPopup(fx){
 const p=$("#pop");p.innerHTML="";
 for(const k in fx){if(!fx[k]||k=="t")continue;const good=(k=="k")?fx[k]<0:fx[k]>0;
  const s=document.createElement("span");s.textContent=NM[K[k]]+" "+(fx[k]>0?"+":"")+fx[k];
  s.style.color=good?"#7fe08f":"#ff7a7a";p.appendChild(s);}
 setTimeout(()=>p.innerHTML="",1500);
}
// setSprite: ganti warna jas + name tag
function setSprite(key){const c=CH[key];$("#sp").style.setProperty("--c",c.c);$(".bd").style.setProperty("--c",c.c);$("#nm").textContent=c.n;}
// typewriter: tampilkan teks per huruf; klik kotak = lewati
function typewriter(text,cb){
 clearInterval(timer);fullText=text;doneCb=cb;typing=true;let i=0;const el=$("#tx");el.textContent="";
 timer=setInterval(()=>{el.textContent=text.slice(0,++i);if(i>=text.length)finishType();},18);
}
function finishType(){
 if(!typing)return;typing=false;clearInterval(timer);$("#tx").textContent=fullText;doneCb&&doneCb();
}
$("#tx").addEventListener("click",finishType);

function fadeTo(html,cb){
 const f=$("#fd");f.innerHTML=html;f.classList.add("on");
 setTimeout(()=>{f.classList.remove("on");cb();},1700);
}
function show(id){document.querySelectorAll(".scr").forEach(s=>s.classList.remove("on"));$(id).classList.add("on");}

// renderScene: tampilkan scene aktif (dengan transisi antar babak)
function renderScene(){
 const sc=STORY[state.sceneIndex];
 if(!sc)return showEndScreen();
 if(sc.babak!==shownBabak){
  shownBabak=sc.babak;state.babak=sc.babak;updateHUD();
  return fadeTo(`BABAK ${sc.babak}<br>${BT[sc.babak-1]}`,renderScene);
 }
 setSprite(sc.speaker);setFace(FACE[sc.speaker]||"");window.scrollTo(0,0);updateHUD();$("#ch").innerHTML="";
 const t=(sc.alt&&state.flags.has(sc.alt[0]))?sc.alt[1]:sc.text;
 typewriter(t,()=>showChoices(sc));
}
function showChoices(sc){
 const box=$("#ch");box.innerHTML="";
 sc.choices.forEach(c=>{const b=document.createElement("button");b.className="btn";b.textContent=c.text;b.onclick=()=>chooseOption(c);box.appendChild(b);});
 box.scrollIntoView({block:'nearest',behavior:'smooth'});
}
// chooseOption: terapkan efek + flag, tampilkan balasan, lanjut
function chooseOption(c){
 $("#ch").innerHTML="";
 for(const k in c.effects)state[K[k]]=clamp(state[K[k]]+c.effects[k]);
 if(c.flag)state.flags.add(c.flag);
 state.flags[state.trust>=8?"add":"delete"]("aj_setia");state.flags[state.trust<=2?"add":"delete"]("aj_khianat");
 let net=0;for(const k in c.effects)if(k!="t")net+=k=="k"?-c.effects[k]:c.effects[k];
 setFace(net>=4?"happy":net<=-6?"shock":net<=-2?"sad":"");
 updateHUD();showStatPopup(c.effects);
 const next=()=>{state.sceneIndex++;renderScene();};
 if(c.reply){
  typewriter(c.reply,()=>{const b=document.createElement("button");b.className="btn";b.textContent="LANJUT ▶";b.onclick=next;$("#ch").appendChild(b);});
 }else next();
}
// showEndScreen: panggil determineEnding dan tampilkan ringkasan
function showEndScreen(){
 const en=determineEnding(state);
 document.documentElement.style.setProperty("--acc",en.color);
 const f=state.flags,pg=[1,2,3,4,5].filter(i=>f.has("hal"+i)).length;
 $("#ex").innerHTML=[`HALAMAN BUKU HITAM: ${pg}/5`,f.has("darmo_menteri")?"Pak Darmo kini pengawas pungli dan sering dimarahi calo.":f.has("darmo_buron")?"Pak Darmo masih dicari dan sudah berjualan di pasar lain.":f.has("darmo_tetap")?"Pak Darmo tetap berjualan, menunggu laporannya dibaca.":"",f.has("aj_khianat")?"Ajudan diam-diam menjual salinan Buku Hitam ke penerbit.":f.has("aj_setia")?"Ajudan setia mendampingi sampai hari terakhir.":""].filter(Boolean).join("<br>");
 $("#et").textContent=en.title;$("#ed").textContent=en.desc;setMood();
 $("#sum").innerHTML=Object.keys(NM).map(k=>`<div>${NM[k]}<br><span style="color:${k=="kor"?"#ff7a7a":"#7fe08f"}">${state[k]}</span></div>`).join("");
 show("#en");
}
function startGame(){
 Object.assign(state,START,{flags:new Set(),sceneIndex:0,babak:1});
 buildPlay();shownBabak=0;buildHUD();updateHUD();show("#gm");try{startMusic()}catch(e){}renderScene();
}
